name: NCX
description: NCX (Natural Capital Exchange), originally founded as SilviaTerra, is a forestry
  technology company that maps and measures every acre of U.S. forestland using satellite
  imagery and machine learning. NCX built the Natural Capital Exchange, a marketplace that
  paid landowners to defer timber harvests and generate forest carbon credits, and it now
  offers LandBook, a tool that helps landowners capture the story, plans, and practical
  knowledge behind their property so it can be passed on to the next steward. The company
  is backed by Union Square Ventures and Version One Ventures.
